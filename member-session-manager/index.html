<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#667761"><title>회원 관리 🍃</title><style>
:root{--bg:#F3F0E7;--paper:#FFFDF8;--brand:#667761;--brand2:#7D8C76;--ink:#233126;--muted:#6F776F;--line:#DCD6CC;--soft:#EDF2EA;--danger:#9A4B45;--dangerSoft:#F8ECEA;--blue:#2F6F8F;--amber:#9A6A2E;--amberSoft:#FAF1E3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#EEF1E7 0,#F5F1E8 42%,#ECE8DE 100%);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);min-height:100vh}button,input,select,textarea{font:inherit}.wrap{max-width:1040px;margin:auto;padding:14px 14px 64px}.home{display:inline-flex;margin-bottom:10px;padding:8px 11px;border-radius:11px;background:var(--paper);border:1px solid var(--line);color:var(--brand);font-weight:800;font-size:13px;text-decoration:none}.hero{background:linear-gradient(145deg,var(--brand),var(--brand2));color:white;padding:25px 20px;border-radius:24px;box-shadow:0 16px 34px rgba(59,74,56,.14)}.hero small{color:#FFF3D9;font-weight:800}.hero h1{margin:4px 0 5px;font-size:30px}.hero p{margin:0;color:#F4F3EC;font-size:13px}.panel{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 9px 24px rgba(68,79,64,.05)}.hide{display:none!important}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer}.primary{background:var(--brand);color:white}.secondary{background:white;color:var(--brand);border:1px solid var(--line)}.danger{background:var(--dangerSoft);color:var(--danger);border:1px solid #EBCFCC}.ownerbar,.titleRow,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px}.ownerbar small,.titleRow small{color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.sum{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:13px}.sum small{color:var(--muted);display:block;font-size:11px}.sum b{display:block;margin-top:3px;font-size:20px}.toolbar{margin-top:12px;align-items:stretch}.toolbar input,.toolbar select{padding:11px;border:1px solid var(--line);border-radius:12px;background:white}.toolbar input{flex:1;min-width:140px}.members{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.member{border:1px solid var(--line);border-radius:16px;padding:14px;background:#FCFBF7}.memberTop{display:flex;justify-content:space-between;gap:10px}.name{font-weight:900;font-size:17px}.meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--brand);font-size:11px;font-weight:900}.badge.upcoming{background:#EEF2F7;color:#4F647A}.badge.paused{background:var(--amberSoft);color:var(--amber)}.badge.ended{background:#EEEAE5;color:#7C746D}.pass{margin-top:10px;padding:11px;border-radius:12px;background:white;border:1px solid var(--line)}.pass b{font-size:13px}.remain{float:right;color:var(--blue);font-weight:900}.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.stat{font-size:11px;padding:5px 7px;border-radius:999px;background:var(--soft);color:var(--muted)}.memberBtns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:14px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted);font-weight:800}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white}.field textarea{min-height:90px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modal{position:fixed;inset:0;background:rgba(24,36,28,.46);display:grid;place-items:end center;padding:12px;z-index:50}.sheet{width:min(720px,100%);max-height:94vh;overflow:auto;background:var(--paper);border-radius:24px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.22)}.sheet h2{margin:0 0 4px}.sub{color:var(--muted);font-size:13px}.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:14px}.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.msg{min-height:22px;margin-top:9px;color:var(--blue);font-size:13px}@media(max-width:720px){.members{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.toolbar{flex-wrap:wrap}.toolbar input{width:100%;flex-basis:100%}.grid2{grid-template-columns:1fr}.hero h1{font-size:27px}}
</style></head><body><main class="wrap"><a class="home" href="../">← Quokka Storage</a><section class="hero"><small>MEMBER OPERATIONS</small><h1>회원 관리 🍃</h1><p>회원 상태 · 목표 빈도 · 수강권 · 최근 회전 상태를 한 곳에서 관리합니다.</p></section>
<section id="authPanel" class="panel hide"><h2 style="margin:0">관리자 로그인</h2><div class="field"><label>이메일</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password"></div><div class="auth-actions"><button id="loginBtn" class="btn primary">로그인</button><a class="btn secondary" style="text-align:center;text-decoration:none" href="../attendance-manager/">출석 관리</a></div><div id="authMsg" class="msg"></div></section>
<section id="app" class="hide"><section class="panel"><div class="ownerbar"><div><b>DB 자동 동기화</b><br><small>이제 회원 명단은 HTML에 고정하지 않고 서버 기준으로 표시합니다.</small></div><button id="logoutBtn" class="btn secondary">로그아웃</button></div></section><section class="summary"><div class="sum"><small>운영중</small><b id="opCount">0명</b></div><div class="sum"><small>등록 예정</small><b id="upCount">0명</b></div><div class="sum"><small>휴식</small><b id="pauseCount">0명</b></div><div class="sum"><small>종료</small><b id="endCount">0명</b></div></section><section class="panel"><div class="titleRow"><div><h2 style="margin:0">회원 명단</h2><small>수정 즉시 다른 화면에도 반영</small></div><button id="addBtn" class="btn primary">+ 회원 추가</button></div><div class="toolbar"><input id="q" placeholder="회원 이름 검색"><select id="statusFilter"><option value="active">현재 회원</option><option value="all">전체</option><option value="operating">운영중</option><option value="upcoming">예정</option><option value="paused">휴식</option><option value="ended">종료</option></select></div><div id="members" class="members"></div></section></section></main>
<div id="memberModal" class="modal hide"><div class="sheet"><h2 id="memberModalTitle">회원 정보</h2><div class="sub">수업 빈도와 상태가 소진 속도·예상매출 계산에 사용됩니다.</div><input id="memberId" type="hidden"><div class="field"><label>회원명</label><input id="mName"></div><div class="grid2"><div class="field"><label>상태</label><select id="mStatus"><option value="operating">운영중</option><option value="upcoming">등록 예정</option><option value="paused">휴식</option><option value="ended">종료</option></select></div><div class="field"><label>시작 예정일</label><input id="mStart" type="date"></div></div><div class="grid2"><div class="field"><label>기본 수업시간</label><select id="mMinutes"><option value="">미정</option><option value="50">50분</option><option value="90">90분</option></select></div><div class="field"><label>목표 수업 빈도</label><select id="mWeekly"><option value="">미정</option><option value="0.5">2주 1회</option><option value="1">주 1회</option><option value="2">주 2회</option><option value="3">주 3회</option></select></div></div><div class="field"><label>메모</label><textarea id="mNotes" placeholder="예: 10월 복귀 예정, 일정 변동 많음"></textarea></div><div class="actions"><button id="cancelMember" class="btn secondary">취소</button><button id="saveMember" class="btn primary">저장</button></div><div id="memberMsg" class="msg"></div></div></div>
<div id="passModal" class="modal hide"><div class="sheet"><h2 id="passTitle">수강권 등록</h2><div class="sub" id="passSub"></div><input id="passMemberId" type="hidden"><div class="grid2"><div class="field"><label>수강권 종류</label><select id="pType"><option value="session">횟수권</option><option value="minute">분 단위권</option></select></div><div class="field"><label>기본 수업시간</label><select id="pMinutes"><option value="50">50분</option><option value="90">90분</option></select></div></div><div class="grid2"><div class="field"><label id="unitsLabel">총 횟수</label><input id="pUnits" type="number" inputmode="numeric" placeholder="10"></div><div class="field"><label>결제금액</label><input id="pAmount" type="number" inputmode="numeric" placeholder="500000"></div></div><div class="grid2"><div class="field"><label>결제일</label><input id="pDate" type="date"></div><div class="field"><label>표시명 · 선택</label><input id="pLabel" placeholder="10회권"></div></div><div class="actions"><button id="cancelPass" class="btn secondary">취소</button><button id="savePass" class="btn primary">수강권 등록</button></div><div id="passMsg" class="msg"></div></div></div>
<script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const URL='https://bspzgodfoekodysjnsrn.supabase.co',KEY='sb_publishable_7JqWs7VbtXMBP_6e_NJnLw_b7yTnShf',sb=createClient(URL,KEY),$=s=>document.querySelector(s);let rows=[];const statusKo={operating:'운영중',upcoming:'등록 예정',paused:'휴식',ended:'종료'};const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';function esc(s=''){return String(s).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}function showAuth(){$('#authPanel').classList.remove('hide');$('#app').classList.add('hide')}async function owner(){const{data,error}=await sb.from('app_owners').select('user_id').maybeSingle();return!error&&!!data}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return showAuth();if(!(await owner()))return showAuth();$('#authPanel').classList.add('hide');$('#app').classList.remove('hide');await load()}async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#authMsg').textContent=error.message;return}await init()}function rem(x){if(!x.pass_id)return'수강권 없음';return x.unit_type==='minute'?Number(x.remaining_minutes||0)+'분':Number(x.remaining_sessions||0)+'회'}function freq(v){v=Number(v||0);if(!v)return'빈도 미정';if(v===.5)return'2주 1회';return'주 '+v+'회'}async function load(){const{data,error}=await sb.rpc('member_management_dashboard');if(error){console.error(error);return}rows=data.rows||[];const s=data.summary||{};$('#opCount').textContent=(s.operating||0)+'명';$('#upCount').textContent=(s.upcoming||0)+'명';$('#pauseCount').textContent=(s.paused||0)+'명';$('#endCount').textContent=(s.ended||0)+'명';render()}function render(){const q=$('#q').value.replace(/\s/g,''),f=$('#statusFilter').value,box=$('#members');const list=rows.filter(x=>(!q||x.name.replace(/\s/g,'').includes(q))&&(f==='all'||(f==='active'?x.service_status!=='ended':x.service_status===f)));box.innerHTML='';if(!list.length){box.innerHTML='<div class="empty">조건에 맞는 회원이 없습니다.</div>';return}list.forEach(x=>{const e=document.createElement('div');e.className='member';const st=x.service_status||'operating',start=x.planned_start_date?' · 시작 '+String(x.planned_start_date).replaceAll('-','.'):'',pass=x.pass_id?'<div class="pass"><b>'+esc(x.pass_label)+'</b><span class="remain">'+rem(x)+'</span><div class="meta">'+won(x.amount_won)+' · '+String(x.purchased_on||'').replaceAll('-','.')+'</div></div>':'<div class="pass"><b>등록 수강권 없음</b><span class="remain">—</span></div>';e.innerHTML='<div class="memberTop"><div><div class="name">'+esc(x.name)+'</div><div class="meta">'+(x.default_minutes?x.default_minutes+'분':'시간 미정')+' · '+freq(x.target_weekly_sessions)+start+'</div></div><span class="badge '+st+'">'+statusKo[st]+'</span></div>'+pass+'<div class="stats"><span class="stat">30일 출석 '+Number(x.attended_30d||0)+'</span><span class="stat">노쇼 '+Number(x.no_show_30d||0)+'</span><span class="stat">취소 '+Number(x.cancelled_30d||0)+'</span><span class="stat">누적결제 '+won(x.lifetime_amount)+'</span></div><div class="memberBtns"><button class="btn secondary edit">회원 정보</button><button class="btn primary passBtn">수강권 등록</button></div>';e.querySelector('.edit').onclick=()=>openMember(x);e.querySelector('.passBtn').onclick=()=>openPass(x);box.appendChild(e)})}function openMember(x=null){$('#memberModal').classList.remove('hide');$('#memberMsg').textContent='';$('#memberModalTitle').textContent=x?'회원 정보 수정':'회원 추가';$('#memberId').value=x?.id||'';$('#mName').value=x?.name||'';$('#mStatus').value=x?.service_status||'upcoming';$('#mStart').value=x?.planned_start_date||'';$('#mMinutes').value=x?.default_minutes||'';$('#mWeekly').value=x?.target_weekly_sessions??'';$('#mNotes').value=x?.notes||''}async function saveMember(){const id=$('#memberId').value,args={p_name:$('#mName').value.trim(),p_default_minutes:$('#mMinutes').value?Number($('#mMinutes').value):null,p_target_weekly_sessions:$('#mWeekly').value?Number($('#mWeekly').value):null,p_service_status:$('#mStatus').value,p_planned_start_date:$('#mStart').value||null,p_notes:$('#mNotes').value.trim()||null};const r=id?await sb.rpc('update_member_profile',{p_member_id:id,...args}):await sb.rpc('create_member_profile',args);if(r.error){$('#memberMsg').textContent=r.error.message;return}$('#memberModal').classList.add('hide');await load()}function openPass(x){$('#passModal').classList.remove('hide');$('#passMsg').textContent='';$('#passMemberId').value=x.id;$('#passTitle').textContent=x.name+'님 수강권 등록';$('#passSub').textContent='등록 즉시 결제매출과 잔여 수강량에 반영됩니다.';$('#pMinutes').value=x.default_minutes||50;$('#pType').value='session';$('#pUnits').value='';$('#pAmount').value='';$('#pDate').value=new Date().toISOString().slice(0,10);$('#pLabel').value='';syncUnits()}function syncUnits(){$('#unitsLabel').textContent=$('#pType').value==='minute'?'총 분':'총 횟수';$('#pUnits').placeholder=$('#pType').value==='minute'?'500':'10'}async function savePass(){const{error}=await sb.rpc('register_member_pass',{p_member_id:$('#passMemberId').value,p_unit_type:$('#pType').value,p_total_units:Number($('#pUnits').value),p_amount_won:Number($('#pAmount').value),p_minutes:Number($('#pMinutes').value),p_purchased_on:$('#pDate').value||null,p_label:$('#pLabel').value.trim()||null});if(error){$('#passMsg').textContent=error.message;return}$('#passModal').classList.add('hide');await load()}$('#loginBtn').onclick=login;$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();showAuth()};$('#addBtn').onclick=()=>openMember();$('#cancelMember').onclick=()=>$('#memberModal').classList.add('hide');$('#saveMember').onclick=saveMember;$('#cancelPass').onclick=()=>$('#passModal').classList.add('hide');$('#savePass').onclick=savePass;$('#pType').onchange=syncUnits;$('#q').oninput=render;$('#statusFilter').onchange=render;init();</script></body></html>
