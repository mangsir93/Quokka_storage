/* Quokka interface · September 2026 */

</style></head><body><header class="app-header"><a class="brand-lockup" href="../" aria-label="Quokka Storage 홈"><span class="brand-name">Quokka Storage</span></a><span class="workspace-label">수업 운영</span></header><main class="wrap"><a class="home" href="../">← Quokka Storage</a><section class="hero"><small>MEMBER OPERATIONS</small><h1>회원 관리</h1><p>회원의 수업 계획과 남은 수강권을 확인하세요.</p></section><nav class="section-nav" aria-label="관리 메뉴"><a href="../member-session-manager/" aria-current="page">회원 관리</a><a href="../attendance-manager/">출석 관리</a><a href="../operations-dashboard/">운영 대시보드</a></nav>
<section id="authPanel" class="panel hide"><h2 style="margin:0">관리자 로그인</h2><div class="field"><label>이메일</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password"></div><div class="auth-actions"><button id="loginBtn" class="btn primary">로그인</button><a class="btn secondary" style="text-align:center;text-decoration:none" href="../attendance-manager/">출석 관리</a></div><div id="authMsg" class="msg"></div></section>
<section id="app" class="hide"><div class="data-toolbar"><span id="dataStatus" class="data-status" role="status" aria-live="polite">정보 확인 중</span><div class="toolbar-actions"><button id="refreshData" class="btn secondary sec" type="button">새로고침</button><button id="logoutBtn" class="btn secondary sec logout-action" type="button">로그아웃</button></div></div><section class="summary"><div class="sum"><small>운영중</small><b id="opCount">0명</b></div><div class="sum"><small>등록 예정</small><b id="upCount">0명</b></div></section><section class="panel"><div class="titleRow"><div><h2 style="margin:0">회원 명단</h2><small>수정 즉시 다른 화면에도 반영</small></div><button id="addBtn" class="btn primary">+ 회원 추가</button></div><div class="toolbar"><input id="q" placeholder="회원 이름 검색"><select id="statusFilter"><option value="active">현재 회원</option><option value="all">전체</option><option value="operating">운영중</option><option value="upcoming">예정</option><option value="paused">휴식</option><option value="ended">종료</option></select></div><div id="members" class="members"></div></section></section></main>
<div id="memberModal" class="modal hide"><div class="sheet"><h2 id="memberModalTitle">회원 정보</h2><div class="sub">수업 빈도와 상태가 소진 속도·예상매출 계산에 사용됩니다.</div><input id="memberId" type="hidden"><div class="field"><label>회원명</label><input id="mName"></div><div class="grid2"><div class="field"><label>상태</label><select id="mStatus"><option value="operating">운영중</option><option value="upcoming">등록 예정</option><option value="paused">휴식</option><option value="ended">종료</option></select></div><div class="field"><label>시작 예정일</label><input id="mStart" type="date"></div></div><div class="grid2"><div class="field"><label>기본 수업시간</label><select id="mMinutes"><option value="">미정</option><option value="50">50분</option><option value="90">90분</option></select></div><div class="field"><label>목표 수업 빈도</label><select id="mWeekly"><option value="">미정</option><option value="0.5">2주 1회</option><option value="1">주 1회</option><option value="2">주 2회</option><option value="3">주 3회</option></select></div></div><div class="field"><label>메모</label><textarea id="mNotes" placeholder="예: 10월 복귀 예정, 일정 변동 많음"></textarea></div><div class="actions"><button id="cancelMember" class="btn secondary">취소</button><button id="saveMember" class="btn primary">저장</button></div><div id="memberMsg" class="msg"></div></div></div>

<script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const URL='https://bspzgodfoekodysjnsrn.supabase.co',KEY='sb_publishable_7JqWs7VbtXMBP_6e_NJnLw_b7yTnShf',sb=createClient(URL,KEY),$=s=>document.querySelector(s);let rows=[],passToken=null;const statusKo={operating:'운영중',upcoming:'등록 예정',paused:'휴식',ended:'종료'};const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';function esc(s=''){return String(s).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}function showAuth(){$('#authPanel').classList.remove('hide');$('#app').classList.add('hide')}async function owner(){const{data,error}=await sb.from('app_owners').select('user_id').maybeSingle();return!error&&!!data}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session)return showAuth();if(!(await owner()))return showAuth();$('#authPanel').classList.add('hide');$('#app').classList.remove('hide');await load()}async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#authMsg').textContent=error.message;return}await init()}function rem(x){if(!x.pass_id)return'수강권 없음';return x.unit_type==='minute'?Number(x.remaining_minutes||0)+'분':Number(x.remaining_sessions||0)+'회'}function freq(v){v=Number(v||0);if(!v)return'빈도 미정';if(v===.5)return'2주 1회';return'주 '+v+'회'}async function loadData(){const{data,error}=await sb.rpc('member_management_dashboard');if(error)throw error;rows=data.rows||[];const s=data.summary||{};$('#opCount').textContent=(s.operating||0)+'명';$('#upCount').textContent=(s.upcoming||0)+'명';render()}function render(){const q=$('#q').value.replace(/\s/g,''),f=$('#statusFilter').value,box=$('#members');const list=rows.filter(x=>(!q||x.name.replace(/\s/g,'').includes(q))&&(f==='all'||(f==='active'?['operating','upcoming'].includes(x.service_status):x.service_status===f)));box.innerHTML='';if(!list.length){box.innerHTML='<div clas vice_status:$('#mStatus').value,p_planned_start_date:$('#mStart').value||null,p_notes:$('#mNotes').value.trim()||null};const r=id?await sb.rpc('update_member_profile',{p_member_id:id,...args}):await sb.rpc('create_member_profile',args);if(r.error){$('#memberMsg').textContent=r.error.message;return}$('#memberModal').classList.add('hide');await load()}function openPass(x){passToken=crypto.randomUUID();$('#pPaid').checked=false;$('#pShared').innerHTML=rows.filter(m=>m.id!==x.id&&m.service_status!=='ended').map(m=>'<option value="'+esc(m.id)+'">'+esc(m.name)+'</option>').join('');$('#passModal').classList.remove('hide');$('#passMsg').textContent='';$('#passMemberId').value=x.id;$('#passTitle').textContent=x.name+'님 수강권 등록';$('#passSub').textContent='등록 즉시 결제매출과 잔여 수강량에 반영됩니다.';$('#pMinutes').value=x.default_minutes||50;$('#pType').value='session';$('#pUnits').value='';$('#pAmount').value='';$('#pDate').value=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());$('#pLabel').value='';syncUnits()}function syncUnits(){$('#unitsLabel').textContent=$('#pType').value==='minute'?'총 분':'총 횟수';$('#pUnits').placeholder=$('#pType').value==='minute'?'500':'10'}async function savePass(){const b=$('#savePass');if(b.disabled)return;if(!$('#pPaid').checked){$('#passMsg').textContent='실제 결제를 확인한 뒤 등록해 주세요.';return}const units=Number($('#pUnits').value),amount=Number($('#pAmount').value);if(!Number.isInteger(units)||units<=0||!$('#pAmount').value||!Number.isInteger(amount)||amount<0||!$('#pDate').value){$('#passMsg').textContent='수량·금액·결제일을 확인해 주세요.';return}b.disabled=true;try{const{error}=await sb.rpc('register_member_pass_safe',{p_member_id:$('#passMemberId').value,p_unit_type:$('#pType').value,p_total_units:units,p_amount_won:amount,p_minutes:Number($('#pMinutes').value),p_purchased_on:$('#pDate').value,p_label:$('#pLabel').value.trim()||null,p_client_token:passToken,p_shared_member_ids:Array.from($('#pShared').selectedOptions,o=>o.value)});if(error)throw error;$('#passModal').classList.add('hide');await load()}catch(e){$('#passMsg').textContent=e.message||'등록 결과를 확인하지 못했습니다. 다시 시도해 주세요.'}finally{b.disabled=false}}$('#loginBtn').onclick=login;$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();showAuth()};$('#addBtn').onclick=()=>openMember();$('#cancelMember').onclick=()=>$('#memberModal').classList.add('hide');$('#saveMember').onclick=saveMember;$('#cancelPass').onclick=()=>$('#passModal').classList.add('hide');$('#savePass').onclick=savePass;$('#pType').onchange=syncUnits;$('#q').oninput=render;$('#statusFilter').onchange=render;let pendingLoads=0;async function load(){const status=$('#dataStatus'),button=$('#refreshData');pendingLoads++;button.disabled=true;status.dataset.state='loading';status.textContent='불러오는 중';try{await loadData();status.dataset.state='ready';status.textContent=new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())+' 업데이트'}catch(e){status.dataset.state='error';status.textContent='불러오기 실패 · 새로고침해 주세요';console.error(e)}finally{pendingLoads--;button.disabled=pendingLoads>0}}$('#refreshData').onclick=()=>load();init();</script></body></html>
