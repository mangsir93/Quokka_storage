<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#667761"><title>출석 관리 · Quokka Storage</title><style>:root{--bg:#F3F0E7;--paper:#FFFDF8;--brand:#667761;--brand2:#7D8C76;--brand3:#55654F;--ink:#233126;--muted:#6F776F;--line:#DCD6CC;--soft:#EDF2EA;--danger:#9A4B45;--dangerSoft:#F8ECEA;--blue:#2F6F8F}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#EEF1E7 0,#F5F1E8 42%,#ECE8DE 100%);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);min-height:100vh}button,input{font:inherit}.wrap{max-width:900px;margin:auto;padding:14px 14px 60px}.home{display:inline-flex;align-items:center;margin-bottom:10px;padding:8px 11px;border-radius:11px;background:var(--paper);border:1px solid var(--line);color:var(--brand);font-weight:800;font-size:13px;text-decoration:none}.hero{background:linear-gradient(145deg,var(--brand),var(--brand2));color:white;padding:24px 20px;border-radius:24px;box-shadow:0 16px 34px rgba(59,74,56,.14)}.hero small{color:#FFF3D9;font-weight:800}.hero h1{margin:4px 0 5px;font-size:30px;letter-spacing:-.04em}.hero p{margin:0;color:#F4F3EC;font-size:13px}.panel{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 9px 24px rgba(68,79,64,.05)}.hide{display:none!important}.auth h2,.panel h2{margin:0 0 12px;font-size:20px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted);font-weight:800}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;font-size:16px}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer}.primary{background:var(--brand);color:white}.secondary{background:white;color:var(--brand);border:1px solid var(--line)}.danger{background:var(--dangerSoft);color:var(--danger);border:1px solid #EBCFCC}.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.msg{min-height:22px;margin-top:9px;color:var(--blue);font-size:13px}.ownerbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.ownerbar small{color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.sum{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:13px}.sum small{color:var(--muted);display:block}.sum b{font-size:21px;color:#19324A}.titleRow{display:flex;align-items:end;justify-content:space-between;gap:8px}.titleRow h2{margin:0}.titleRow small{color:var(--muted)}.members{display:grid;gap:9px;margin-top:12px}.member{display:grid;grid-template-columns:minmax(110px,1fr) auto auto;align-items:center;gap:10px;border:1px solid var(--line);border-radius:15px;padding:12px;background:#FCFBF7}.member .name{font-weight:900;font-size:16px}.member .meta{font-size:12px;color:var(--muted);margin-top:2px}.remain{text-align:right}.remain b{display:block;font-size:18px;color:var(--blue)}.attend{background:var(--brand);color:white;border:0;border-radius:11px;padding:10px 12px;font-weight:900}.history{display:grid;gap:8px;margin-top:12px}.hist{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#FCFBF7}.hist b{font-size:15px}.hist .meta{font-size:12px;color:var(--muted);margin-top:3px}.histBtns{display:flex;gap:6px;align-items:center}.mini{padding:8px 9px;border-radius:10px;border:1px solid var(--line);background:white;color:var(--brand);font-size:12px;font-weight:800}.mini.d{color:var(--danger);background:var(--dangerSoft);border-color:#EBCFCC}.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:14px}.modal{position:fixed;inset:0;background:rgba(24,36,28,.46);display:grid;place-items:end center;padding:12px;z-index:50}.sheet{width:min(680px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:24px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.22)}.sheet h2{margin:0 0 4px}.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:12px}.sigWrap{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:white}.sigLabel{padding:9px 11px;background:#F7F5EF;color:var(--muted);font-size:12px;font-weight:800;border-bottom:1px solid var(--line)}canvas{display:block;width:100%;height:220px;touch-action:none;background:white}.modalActions{display:grid;grid-template-columns:auto 1fr 1.4fr;gap:8px;margin-top:12px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#24362A;color:white;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:800;z-index:100;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:640px){.summary{grid-template-columns:1fr 1fr 1fr}.member{grid-template-columns:1fr auto}.member .attend{grid-column:1/-1}.hist{grid-template-columns:1fr}.histBtns{justify-content:flex-end}.modalActions{grid-template-columns:1fr 1fr}.modalActions .primary{grid-column:1/-1}.hero h1{font-size:27px}}</style></head><body><main class="wrap"><a class="home" href="../">← Quokka Storage</a><section class="hero"><small>SERVER ATTENDANCE</small><h1>출석 · 서명 관리 🍃</h1><p>서명 완료 시 서버에 출석이 저장되고 해당 수강권이 1회 자동 차감됩니다.</p></section><section id="authPanel" class="panel auth"><h2>관리자 로그인</h2><div class="field"><label>이메일</label><input id="email" type="email" autocomplete="email" placeholder="관리자 이메일"></div><div class="field"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호 6자 이상"></div><div id="setupField" class="field"><label>최초 설정 코드 · 처음 한 번만 사용</label><input id="setupCode" autocomplete="off" placeholder="설정 코드"></div><div class="auth-actions"><button id="loginBtn" class="btn primary">로그인</button><button id="signupBtn" class="btn secondary">첫 계정 만들기</button></div><div id="authMsg" class="msg"></div></section><section id="claimPanel" class="panel hide"><h2>관리자 권한 연결</h2><p style="margin:0;color:var(--muted);font-size:13px">로그인은 완료됐어요. 최초 설정 코드를 입력하면 이 계정에 관리자 권한이 영구 연결됩니다.</p><div class="field"><label>최초 설정 코드</label><input id="claimCode" autocomplete="off"></div><button id="claimBtn" class="btn primary" style="width:100%">관리자 권한 연결</button><div id="claimMsg" class="msg"></div></section><section id="app" class="hide"><section class="panel"><div class="ownerbar"><div><b>서버 동기화 사용 중</b><br><small id="syncText">Supabase · 실시간 저장</small></div><button id="logoutBtn" class="btn secondary">로그아웃</button></div></section><section class="summary"><div class="sum"><small>출석 가능 회원</small><b id="memberCount">0명</b></div><div class="sum"><small>남은 세션</small><b id="totalRemain">0회</b></div><div class="sum"><small>오늘 출석</small><b id="todayCount">0회</b></div></section><section class="panel"><div class="titleRow"><h2>회원 출석</h2><small>서명 → 자동 1회 차감</small></div><div id="members" class="members"></div></section><section class="panel"><div class="titleRow"><h2>출석 기록</h2><small>최근 300건</small></div><div id="history" class="history"></div></section></section></main><div id="signModal" class="modal hide"><div class="sheet"><h2 id="modalName">출석 서명</h2><div id="modalMeta" class="sub"></div><div class="field"><label>출석 일시</label><input id="attendedAt" type="datetime-local"></div><div class="sigWrap"><div class="sigLabel">회원님이 아래 칸에 직접 서명해 주세요.</div><canvas id="sigCanvas"></canvas></div><div class="modalActions"><button id="clearSig" class="btn secondary">다시 쓰기</button><button id="cancelSig" class="btn secondary">취소</button><button id="saveSig" class="btn primary">서명 완료 · 1회 차감</button></div></div></div><div id="viewModal" class="modal hide"><div class="sheet"><h2 id="viewTitle">서명 확인</h2><div id="viewMeta" class="sub"></div><div class="sigWrap"><canvas id="viewCanvas" style="height:240px"></canvas></div><button id="closeView" class="btn primary" style="width:100%;margin-top:12px">닫기</button></div></div><div id="toast" class="toast"></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const URL='https://bspzgodfoekodysjnsrn.supabase.co',KEY='sb_publishable_7JqWs7VbtXMBP_6e_NJnLw_b7yTnShf',sb=createClient(URL,KEY),$=s=>document.querySelector(s);let dashboard={members:[],history:[]},selected=null,strokes=[],drawing=false;const authPanel=$('#authPanel'),claimPanel=$('#claimPanel'),app=$('#app'),canvas=$('#sigCanvas'),ctx=canvas.getContext('2d'),viewCanvas=$('#viewCanvas'),vctx=viewCanvas.getContext('2d');function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function localDT(d=new Date()){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes())}function fmt(iso){return new Intl.DateTimeFormat('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso))}function sameDay(a,b=new Date()){const d=new Date(a);return d.getFullYear()===b.getFullYear()&&d.getMonth()===b.getMonth()&&d.getDate()===b.getDate()}async function owner(){const{data,error}=await sb.from('app_owners').select('user_id').maybeSingle();return !error&&!!data}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){showAuth();return}if(await owner()){showApp();await load()}else{authPanel.classList.add('hide');app.classList.add('hide');claimPanel.classList.remove('hide')}}function showAuth(){authPanel.classList.remove('hide');claimPanel.classList.add('hide');app.classList.add('hide')}function showApp(){authPanel.classList.add('hide');claimPanel.classList.add('hide');app.classList.remove('hide')}async function login(){const email=$('#email').value.trim(),password=$('#password').value;$('#authMsg').textContent='로그인 중…';const{error}=await sb.auth.signInWithPassword({email,password});if(error){$('#authMsg').textContent=error.message;return}$('#authMsg').textContent='';await init()}async function signup(){const email=$('#email').value.trim(),password=$('#password').value,code=$('#setupCode').value.trim();if(!email||password.length<6||!code){$('#authMsg').textContent='이메일·비밀번호(6자 이상)·최초 설정 코드를 입력해 주세요.';return}$('#authMsg').textContent='계정 생성 중…';const{data,error}=await sb.auth.signUp({email,password});if(error){$('#authMsg').textContent=error.message;return}if(data.session){const{data:ok,error:e}=await sb.rpc('claim_owner',{p_code:code});if(e||!ok){$('#authMsg').textContent='계정은 생성됐지만 설정 코드 확인에 실패했어요.';return}await init()}else{$('#authMsg').textContent='확인 메일을 보냈어요. 이메일 인증 후 로그인하고 같은 설정 코드를 입력해 주세요.'}}async function claim(){const code=$('#claimCode').value.trim();$('#claimMsg').textContent='확인 중…';const{data,error}=await sb.rpc('claim_owner',{p_code:code});if(error||!data){$('#claimMsg').textContent='설정 코드가 맞지 않거나 이미 다른 관리자 계정이 연결되어 있어요.';return}$('#claimMsg').textContent='';await init()}async function load(){const{data,error}=await sb.rpc('attendance_dashboard');if(error){toast('서버 불러오기 실패');return}dashboard=data||{members:[],history:[]};render()}function render(){const members=dashboard.members||[],history=dashboard.history||[];const distinct=new Map;members.forEach(m=>{if(!distinct.has(m.member_id))distinct.set(m.member_id,m)});$('#memberCount').textContent=distinct.size+'명';const passes=new Map;members.forEach(m=>passes.set(m.pass_id,m));$('#totalRemain').textContent=[...passes.values()].reduce((a,m)=>a+Number(m.remaining_sessions||0),0)+'회';$('#todayCount').textContent=history.filter(h=>sameDay(h.attended_at)).length+'회';const box=$('#members');box.innerHTML='';if(!members.length)box.innerHTML='<div class="empty">현재 출석 가능한 수강권이 없습니다.</div>';members.forEach(m=>{const el=document.createElement('div');el.className='member';el.innerHTML='<div><div class="name">'+m.name+'</div><div class="meta">'+m.minutes+'분 · '+m.pass_label+' · 결제 '+m.purchased_on+'</div></div><div class="remain"><small>남음</small><b>'+m.remaining_sessions+'회</b></div><button class="attend">출석하기</button>';el.querySelector('.attend').onclick=()=>openSign(m);box.appendChild(el)});const hb=$('#history');hb.innerHTML='';if(!history.length)hb.innerHTML='<div class="empty">아직 출석 기록이 없습니다.</div>';history.forEach(h=>{const el=document.createElement('div');el.className='hist';el.innerHTML='<div><b>'+h.name+'</b><div class="meta">'+fmt(h.attended_at)+' · '+h.minutes+'분 · '+h.pass_label+'</div></div><div class="histBtns"><button class="mini view">서명 보기</button><button class="mini d void">출석 취소</button></div>';el.querySelector('.view').onclick=()=>viewSig(h);el.querySelector('.void').onclick=()=>voidAtt(h);hb.appendChild(el)})}function fit(c,context){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);context.setTransform(d,0,0,d,0,0);context.lineCap='round';context.lineJoin='round';context.lineWidth=2.2;context.strokeStyle='#24362A'}function redraw(c,context,data){fit(c,context);context.clearRect(0,0,c.clientWidth,c.clientHeight);const ss=data?.strokes||[];ss.forEach(s=>{if(!s.length)return;context.beginPath();s.forEach((p,i)=>{const x=p[0]*c.clientWidth,y=p[1]*c.clientHeight;i?context.lineTo(x,y):context.moveTo(x,y)});context.stroke()})}function point(e,c){const r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}function openSign(m){selected=m;strokes=[];$('#modalName').textContent=m.name+'님 출석 서명';$('#modalMeta').textContent=m.minutes+'분 · '+m.pass_label+' · 현재 남은 세션 '+m.remaining_sessions+'회';$('#attendedAt').value=localDT();$('#signModal').classList.remove('hide');requestAnimationFrame(()=>redraw(canvas,ctx,{strokes}))}canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);strokes.push([point(e,canvas)]);redraw(canvas,ctx,{strokes})});canvas.addEventListener('pointermove',e=>{if(!drawing)return;strokes.at(-1).push(point(e,canvas));redraw(canvas,ctx,{strokes})});['pointerup','pointercancel'].forEach(t=>canvas.addEventListener(t,()=>drawing=false));$('#clearSig').onclick=()=>{strokes=[];redraw(canvas,ctx,{strokes})};$('#cancelSig').onclick=()=>$('#signModal').classList.add('hide');$('#saveSig').onclick=async()=>{if(!selected||!strokes.some(s=>s.length>1)){toast('서명을 먼저 해주세요');return}const b=$('#saveSig');b.disabled=true;b.textContent='저장 중…';const token=crypto.randomUUID(),when=new Date($('#attendedAt').value).toISOString();const{data,error}=await sb.rpc('record_attendance',{p_member_id:selected.member_id,p_signature:{v:1,strokes},p_attended_at:when,p_client_token:token});b.disabled=false;b.textContent='서명 완료 · 1회 차감';if(error){toast(error.message.includes('No remaining')?'남은 세션이 없습니다':'저장 실패');return}$('#signModal').classList.add('hide');toast('출석 완료 · 1회 차감');await load()};function viewSig(h){$('#viewTitle').textContent=h.name+'님 서명';$('#viewMeta').textContent=fmt(h.attended_at)+' · '+h.minutes+'분';$('#viewModal').classList.remove('hide');requestAnimationFrame(()=>redraw(viewCanvas,vctx,h.signature))}$('#closeView').onclick=()=>$('#viewModal').classList.add('hide');async function voidAtt(h){if(!confirm(h.name+'님의 '+fmt(h.attended_at)+' 출석을 취소할까요?\n취소하면 세션 1회가 복구됩니다.'))return;const{data,error}=await sb.rpc('void_attendance',{p_attendance_id:h.id});if(error||!data){toast('출석 취소 실패');return}toast('출석 취소 · 1회 복구');await load()}$('#loginBtn').onclick=login;$('#signupBtn').onclick=signup;$('#claimBtn').onclick=claim;$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();showAuth()};window.addEventListener('resize',()=>{if(!$('#signModal').classList.contains('hide'))redraw(canvas,ctx,{strokes})});sb.auth.onAuthStateChange(()=>{});init();</script></body></html>
