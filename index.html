<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8faf7">
<title>Quokka Storage · 수업 관리</title>
<style>
:root{color-scheme:light;--bg:#f8faf8;--white:#fff;--ink:#202d25;--sub:#64746a;--line:#e6ece7;--green:#226b3b;--soft:#f0f6f1;--font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-family:var(--font)}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;letter-spacing:-.025em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
a:focus-visible{outline:3px solid #9acaab;outline-offset:3px}
.shell{max-width:940px;margin:auto;padding:0 26px 48px}
header{height:65px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{font-size:18px;font-weight:680;letter-spacing:-.065em}
.brand em{font-style:normal;color:var(--green)}
.header-label{font-size:11px;color:var(--sub);font-weight:500}
.intro{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:28px 0 22px}
.intro h1{margin:0;font-size:clamp(25px,3.2vw,32px);font-weight:680;letter-spacing:-.06em;line-height:1.3}
.intro p{margin:6px 0 0;color:var(--sub);font-size:12px}
.date{color:#547c5c;background:var(--soft);border:1px solid #e3ece4;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:600;white-space:nowrap}
.heading{display:flex;align-items:baseline;justify-content:space-between;margin:3px 0 11px}
.heading h2{margin:0;font-size:14px;font-weight:650;letter-spacing:-.035em}
.heading span{font-size:11px;color:var(--sub)}
.menu{background:var(--white);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 4px 20px #182b1d08}
.menu a{display:flex;align-items:center;gap:14px;min-height:78px;padding:14px 17px;transition:background .15s}
.menu a+a{border-top:1px solid var(--line)}
.menu a:hover{background:#f4f8f4}
.icon{width:37px;height:37px;flex:0 0 37px;display:grid;place-items:center;border-radius:11px;background:var(--soft);color:var(--green)}
.icon svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.menu-text{flex:1;min-width:0}
.menu-text strong{display:block;font-size:15px;font-weight:680;letter-spacing:-.05em}
.menu-text small{display:block;margin-top:2px;font-size:11px;color:var(--sub)}
.chevron{color:#9caba0;font-size:21px;font-weight:300}
footer{margin-top:24px;color:#a1aba3;font-size:10px;text-align:center}
.bottom{display:none}
@media(max-width:700px){
body{padding-top:max(env(safe-area-inset-top),38px)}
.shell{padding:0 17px 104px}
header{height:49px}
.brand{font-size:16px}
.intro{padding:20px 0 19px;align-items:center}
.intro h1{font-size:26px}
.intro p{font-size:12px}
.date{font-size:10px;padding:6px 8px}
.menu a{min-height:74px;padding:13px 14px}
.menu-text strong{font-size:15px}
.heading{margin-bottom:10px}
footer{display:none}
.bottom{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:30;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:9px 8px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}
.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:44px;gap:4px;color:#8b968c;font-size:10px}
.bottom a[aria-current="page"]{color:var(--green);font-weight:650}
.bottom svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
}
@media(max-width:360px){.intro h1{font-size:23px}.date{font-size:9px}.menu a{gap:10px}}
@media(prefers-reduced-motion:reduce){.menu a{transition:none}}
</style>
</head>
<body>
<div class="shell">
<header><a href="./" class="brand">quokka<em>.</em>storage</a><span class="header-label">수업 관리</span></header>
<main>
<section class="intro"><div><h1>수업 관리</h1><p>회원 · 출석 · 매출</p></div><time class="date" id="today"></time></section>
<div class="heading"><h2>바로가기</h2><span>회원 · 출석 · 운영</span></div>
<nav class="menu" aria-label="관리 메뉴">
<a href="./member-session-manager/"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 8h5M19.5 5.5v5"/></svg></span><span class="menu-text"><strong>회원 관리</strong><small>회원 정보 · 수강권</small></span><span class="chevron">›</span></a>
<a href="./attendance-manager/"><span class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18m-12 5 2 2 4-4"/></svg></span><span class="menu-text"><strong>출석 기록</strong><small>출석 · 서명 · 노쇼</small></span><span class="chevron">›</span></a>
<a href="./operations-dashboard/"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 20V10m5 10V5m5 15v-7m5 7V3"/></svg></span><span class="menu-text"><strong>운영 대시보드</strong><small>소진매출 · 재등록 · 현금</small></span><span class="chevron">›</span></a>
</nav>
</main>
<footer>QUOKKA STORAGE</footer>
</div>
<nav class="bottom" aria-label="하단 메뉴">
<a href="./" aria-current="page"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/></svg>홈</a>
<a href="./member-session-manager/"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 8h5"/></svg>회원</a>
<a href="./attendance-manager/"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18m-12 5 2 2 4-4"/></svg>출석</a>
<a href="./operations-dashboard/"><svg viewBox="0 0 24 24"><path d="M4 20V10m5 10V5m5 15v-7m5 7V3"/></svg>운영</a>
</nav>
<script>
document.getElementById('today').textContent=new Intl.DateTimeFormat('ko-KR',{month:'numeric',day:'numeric',weekday:'short'}).format(new Date());
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}))}
</script>
</body></html>
