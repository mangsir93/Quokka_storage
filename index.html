<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quokka Storage</title><style>:root{--bg:#F3F0E7;--paper:#FFFDF8;--brand:#667761;--brand2:#7D8C76;--brand3:#55654F;--ink:#233126;--muted:#6F776F;--line:#DCD6CC;--soft:#EDF2EA}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#EEF1E7 0,#F5F1E8 42%,#ECE8DE 100%);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);min-height:100vh}a{text-decoration:none;color:inherit}.wrap{max-width:820px;margin:0 auto;padding:26px 18px 56px}.hero{background:linear-gradient(145deg,var(--brand),var(--brand2));border-radius:30px;padding:28px 22px 24px;box-shadow:0 18px 40px rgba(59,74,56,.18);border:1px solid rgba(255,255,255,.22);text-align:center}.hero h1{margin:0;color:#FFFDF8;font-size:40px;line-height:1.05;letter-spacing:-.045em;font-weight:900}.image-shell{margin:24px auto 0;width:min(470px,88vw);padding:10px;background:rgba(255,255,255,.16);border-radius:30px}.quokka{display:block;width:100%;height:auto;border-radius:22px;object-fit:cover}.category{margin-top:26px}.category-title{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}.category-title h2{margin:0;font-size:22px;letter-spacing:-.03em}.category-title span{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}.tabs{display:grid;gap:12px}.tab{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 26px rgba(68,79,64,.07);transition:.15s ease}.tab:hover{transform:translateY(-2px)}.tab:active{transform:scale(.99)}.tab-left{display:flex;align-items:center;gap:13px;min-width:0}.icon{width:46px;height:46px;flex:0 0 auto;border-radius:15px;background:linear-gradient(145deg,var(--brand),var(--brand3));display:grid;place-items:center;color:white;font-size:21px;font-weight:900}.tab-text b{display:block;font-size:18px;letter-spacing:-.02em}.arrow{font-size:25px;color:var(--brand);font-weight:800}footer{text-align:center;margin-top:24px;color:#92988F;font-size:11px}@media(max-width:560px){.wrap{padding-top:18px}.hero{padding:24px 16px 20px;border-radius:26px}.hero h1{font-size:34px}.image-shell{width:100%;margin-top:20px}.category-title h2{font-size:21px}.tab{padding:16px}}</style></head><body><main class="wrap"><section class="hero"><h1>Quokka Storage</h1><div class="image-shell"><img class="quokka" src="./assets/quokka-main-8664.webp?v=2" alt="Quokka illustration"></div></section><section class="category"><div class="category-title"><h2>카테고리</h2><span>CATEGORY</span></div><div class="tabs"><a class="tab" href="./member-session-manager/"><div class="tab-left"><div class="icon">✓</div><div class="tab-text"><b>수강권 관리</b></div></div><div class="arrow">›</div></a></div></section><footer>Quokka Storage</footer></main></body></html>
