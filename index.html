<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quokka Storage 🐹</title><style>:root{--bg:#F6F1E8;--paper:#FFFDF9;--brand:#667761;--brand2:#7D8C76;--ink:#243126;--muted:#6F776F;--line:#E5DED4;--soft:#EEF2EC;--accent:#DDE7DA}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}.wrap{max-width:980px;margin:auto;padding:18px 14px 48px}.hero{padding:34px 4px 24px}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.12em;color:var(--brand);text-transform:uppercase}.hero h1{margin:8px 0 10px;font-size:38px;line-height:1.1;letter-spacing:-.04em}.hero p{margin:0;max-width:650px;color:var(--muted);font-size:15px;line-height:1.7}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 28px}.tab{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:13px;font-weight:800;color:var(--brand)}.section-head{display:flex;align-items:end;justify-content:space-between;margin:4px 0 12px}.section-head h2{margin:0;font-size:22px;letter-spacing:-.03em}.count{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{display:block;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;transition:.18s ease;box-shadow:0 8px 24px rgba(60,70,58,.04)}.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(60,70,58,.08)}.icon{width:42px;height:42px;border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:14px}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--accent);color:#4D634D;font-size:11px;font-weight:900;margin-bottom:8px}.card h3{margin:0 0 7px;font-size:19px;letter-spacing:-.025em}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.go{margin-top:16px;color:var(--brand);font-size:13px;font-weight:900}.footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:#8A8F88}@media(max-width:680px){.hero{padding-top:25px}.hero h1{font-size:33px}.grid{grid-template-columns:1fr}.card{padding:17px}}</style></head><body><main class="wrap"><header class="hero"><div class="eyebrow">🐹 QUOKKA STORAGE</div><h1>쿼카 저장소</h1><p>수업 운영과 회원 관리를 위한 개인 작업 공간. 필요한 페이지를 한곳에서 빠르게 열고 관리합니다.</p></header><nav class="tabs"><a class="tab" href="#management">회원 관리</a></nav><section id="management"><div class="section-head"><h2>회원 관리</h2><span class="count">1 page</span></div><div class="grid"><a class="card" href="./member-session-manager/"><div class="icon">🍃</div><span class="tag">MANAGEMENT</span><h3>회원 수강권 · 세션 관리</h3><p>등록 수강권, 진행 세션, 남은 세션과 결제 정보를 한눈에 확인하고 기록합니다.</p><div class="go">페이지 열기 →</div></a></div></section><footer class="footer">Quokka Storage · Personal Workspace</footer></main></body></html>
