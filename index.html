@media(max-width:700px){.shell{padding:0 19px 104px}header{height:64px}.brand{font-size:18px}.hero{padding:35px 0 23px;display:block}.hero h1{font-size:32px}.hero p{font-size:13px;margin-top:10px}.date{display:inline-block;margin-top:18px;padding:8px 12px}.section-head{margin-top:24px}.quick{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{min-height:158px;padding:15px;border-radius:13px}.tile:last-child{grid-column:1/-1;min-height:132px}.tile-icon{width:34px;height:34px}.tile-icon svg{width:18px;height:18px}.tile h3{font-size:17px}.tile p{font-size:11px}.note{padding:15px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:10px 10px calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);z-index:40}.mobile-nav a{display:flex;flex-direction:column;align-items:center;gap:5px;color:#8a958a;font-size:10px}.mobile-nav a.active{color:var(--green);font-weight:750}.mobile-nav svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}footer{display:none}}

@media(prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
