<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#667761">
<title>수업 일지 · Quokka Storage</title>
<style>
:root{--bg:#F3F0E7;--paper:#FFFDF8;--brand:#667761;--brand2:#7D8C76;--brand3:#55654F;--ink:#233126;--muted:#6F776F;--line:#DCD6CC;--soft:#EDF2EA;--danger:#9A4B45;--dangerSoft:#F8ECEA;--blue:#2F6F8F}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#EEF1E7 0,#F5F1E8 42%,#ECE8DE 100%);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);min-height:100vh}button,input,textarea,select{font:inherit}.wrap{max-width:940px;margin:auto;padding:14px 14px 64px}.home{display:inline-flex;align-items:center;margin-bottom:10px;padding:8px 11px;border-radius:11px;background:var(--paper);border:1px solid var(--line);color:var(--brand);font-weight:800;font-size:13px;text-decoration:none}.hero{background:linear-gradient(145deg,var(--brand),var(--brand2));color:white;padding:24px 20px;border-radius:24px;box-shadow:0 16px 34px rgba(59,74,56,.14)}.hero small{color:#FFF3D9;font-weight:800}.hero h1{margin:4px 0 5px;font-size:30px;letter-spacing:-.04em}.hero p{margin:0;color:#F4F3EC;font-size:13px}.panel{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 9px 24px rgba(68,79,64,.05)}.hide{display:none!important}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted);font-weight:800}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;font-size:15px}.field textarea{min-height:120px;resize:vertical}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}.primary{background:var(--brand);color:white}.secondary{background:white;color:var(--brand);border:1px solid var(--line)}.danger{background:var(--dangerSoft);color:var(--danger);border:1px solid #EBCFCC}.msg{min-height:22px;margin-top:9px;color:var(--blue);font-size:13px}.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.ownerbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.ownerbar small{color:var(--muted)}.titleRow{display:flex;align-items:center;justify-content:space-between;gap:10px}.titleRow h2{margin:0;font-size:20px}.search{margin-top:12px;width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:white}.members{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.member{border:1px solid var(--line);border-radius:15px;padding:13px;background:#FCFBF7;cursor:pointer}.member:active{transform:scale(.99)}.member .name{font-weight:900;font-size:16px}.member .meta{font-size:12px;color:var(--muted);margin-top:4px}.member .latest{margin-top:9px;color:var(--brand);font-size:12px;font-weight:800}.detailHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.detailHead h2{margin:0}.back{border:0;background:transparent;color:var(--brand);font-weight:900;padding:4px 0;cursor:pointer}.timeline{display:grid;gap:9px;margin-top:12px}.log{border:1px solid var(--line);border-radius:15px;background:#FCFBF7;padding:13px}.logTop{display:flex;justify-content:space-between;align-items:start;gap:8px}.logTop b{font-size:15px}.meta{font-size:12px;color:var(--muted);margin-top:3px}.notes{margin-top:9px;font-size:13px;line-height:1.5;white-space:pre-wrap}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{font-size:11px;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--brand);font-weight:800}.logBtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.mini{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:white;color:var(--brand);font-size:12px;font-weight:800}.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:14px}.modal{position:fixed;inset:0;background:rgba(24,36,28,.46);display:grid;place-items:end center;padding:12px;z-index:50}.sheet{width:min(780px,100%);max-height:94vh;overflow:auto;background:var(--paper);border-radius:24px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.22)}.sheet h2{margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:12px}.exerciseTools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}.exerciseTools h3{margin:0;font-size:17px}.rows{display:grid;gap:9px;margin-top:10px}.row{border:1px solid var(--line);border-radius:14px;padding:10px;background:#FCFBF7}.rowTop{display:grid;grid-template-columns:minmax(140px,1.5fr) repeat(3,minmax(75px,.7fr)) auto;gap:7px}.row input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:white}.unitField{position:relative;min-width:0}.unitField input{padding-right:46px}.unitSuffix{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;font-weight:800;pointer-events:none}.rowMemo{margin-top:7px}.remove{border:0;border-radius:10px;background:var(--dangerSoft);color:var(--danger);font-weight:900;padding:0 11px}.editorActions{display:grid;grid-template-columns:auto 1fr 1.5fr;gap:8px;margin-top:14px}.sigWrap{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:white}.sigWrap canvas{display:block;width:100%;height:240px;background:white}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#24362A;color:white;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:800;z-index:100;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(max-width:700px){.members{grid-template-columns:1fr}.rowTop{grid-template-columns:1fr 1fr}.rowTop .nameInput{grid-column:1/-1}.rowTop .remove{grid-column:2}.editorActions{grid-template-columns:1fr 1fr}.editorActions .primary{grid-column:1/-1}.hero h1{font-size:27px}}
</style>
</head>
<body>
<main class="wrap">
<a class="home" href="../">← Quokka Storage</a>
<section class="hero"><small>SESSION LOG</small><h1>수업 일지 🍃</h1><p>출석 기록과 연결해 특이사항과 운동 기록을 회원별로 관리합니다.</p></section>
<section id="authPanel" class="panel hide"><h2 style="margin:0">관리자 로그인</h2><div class="field"><label>이메일</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password"></div><div class="auth-actions"><button id="loginBtn" class="btn primary">로그인</button><a class="btn secondary" style="text-align:center;text-decoration:none" href="../attendance-manager/">출석 관리로 이동</a></div><div id="authMsg" class="msg"></div></section>
<section id="app" class="hide">
<section class="panel"><div class="ownerbar"><div><b>서버 동기화 사용 중</b><br><small>Supabase · 관리자 전용</small></div><button id="logoutBtn" class="btn secondary">로그아웃</button></div></section>
<section id="memberPanel" class="panel"><div class="titleRow"><h2>회원 선택</h2><small id="memberCount"></small></div><input id="search" class="search" placeholder="회원 이름 검색"><div id="members" class="members"></div></section>
<section id="detailPanel" class="panel hide"><div class="detailHead"><div><button id="backBtn" class="back">← 회원 목록</button><h2 id="detailName"></h2></div><button id="newBtn" class="btn primary">+ 새 일지 작성</button></div><div id="timeline" class="timeline"></div></section>
</section>
</main>
<div id="editor" class="modal hide"><div class="sheet"><h2 id="editorTitle">수업 일지 작성</h2><div id="editorSub" class="sub"></div><div class="field"><label>연결할 출석 기록</label><select id="attendanceSelect"></select></div><div class="field"><label>그 날의 특이사항</label><textarea id="specialNotes" placeholder="컨디션, 증상 변화, 통증, 피로도, 수업 중 특이사항 등을 기록하세요."></textarea></div><div class="exerciseTools"><h3>운동 기록</h3><div style="display:flex;gap:6px"><button id="copyPrev" class="mini">지난 수업 불러오기</button><button id="addExercise" class="mini">+ 운동 추가</button></div></div><div id="exerciseRows" class="rows"></div><div class="editorActions"><button id="deleteLog" class="btn danger hide">일지 삭제</button><button id="cancelEdit" class="btn secondary">취소</button><button id="saveLog" class="btn primary">저장</button></div></div></div>
<div id="sigModal" class="modal hide"><div class="sheet"><h2 id="sigTitle">출석 서명</h2><div id="sigMeta" class="sub"></div><div class="sigWrap"><canvas id="sigCanvas"></canvas></div><button id="closeSig" class="btn primary" style="width:100%;margin-top:12px">닫기</button></div></div>
<div id="toast" class="toast"></div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const URL='https://bspzgodfoekodysjnsrn.supabase.co',KEY='sb_publishable_7JqWs7VbtXMBP_6e_NJnLw_b7yTnShf',sb=createClient(URL,KEY),$=s=>document.querySelector(s);
let data={members:[],attendance:[],logs:[]},currentMember=null,editing=null;
const deepAttendance=new URLSearchParams(location.search).get('attendance_id');let deepHandled=false;
const authPanel=$('#authPanel'),app=$('#app'),memberPanel=$('#memberPanel'),detailPanel=$('#detailPanel');
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function fmt(iso){return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso))}
function fmtDate(iso){if(!iso)return '기록 없음';return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(iso))}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function owner(){const{data,error}=await sb.from('app_owners').select('user_id').maybeSingle();return !error&&!!data}
async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){showAuth();return}if(await owner()){authPanel.classList.add('hide');app.classList.remove('hide');await load()}else{showAuth();$('#authMsg').textContent='이 계정에는 관리자 권한이 없습니다.'}}
function showAuth(){authPanel.classList.remove('hide');app.classList.add('hide')}
async function login(){const email=$('#email').value.trim(),password=$('#password').value;$('#authMsg').textContent='로그인 중…';const{error}=await sb.auth.signInWithPassword({email,password});if(error){$('#authMsg').textContent=error.message;return}$('#authMsg').textContent='';await init()}
async function load(){const{data:d,error}=await sb.rpc('session_log_dashboard');if(error){toast('수업 일지를 불러오지 못했어요');return}data=d||{members:[],attendance:[],logs:[]};renderMembers();if(currentMember)openMember(currentMember);else if(deepAttendance&&!deepHandled)openDeepAttendance(deepAttendance)}
function renderMembers(){const q=$('#search').value.trim();const list=(data.members||[]).filter(m=>!q||m.name.includes(q));$('#memberCount').textContent=(data.members||[]).length+'명';const box=$('#members');box.innerHTML='';if(!list.length){box.innerHTML='<div class="empty">회원이 없습니다.</div>';return}list.forEach(m=>{const el=document.createElement('div');el.className='member';el.innerHTML='<div class="name">'+esc(m.name)+'</div><div class="meta">기본 '+m.minutes+'분 · 작성된 일지 '+m.log_count+'건</div><div class="latest">최근 일지 · '+fmtDate(m.latest_attended_at)+'</div>';el.onclick=()=>openMember(m.member_id);box.appendChild(el)})}
function openMember(id){currentMember=id;const m=(data.members||[]).find(x=>x.member_id===id);if(!m)return;memberPanel.classList.add('hide');detailPanel.classList.remove('hide');$('#detailName').textContent=m.name+'님 수업 일지';const logs=(data.logs||[]).filter(x=>x.member_id===id).sort((a,b)=>new Date(b.attended_at)-new Date(a.attended_at));const box=$('#timeline');box.innerHTML='';if(!logs.length){box.innerHTML='<div class="empty">아직 작성된 수업 일지가 없습니다.<br>출석 서명 후 첫 일지를 작성해보세요.</div>';return}logs.forEach(l=>{const el=document.createElement('div');el.className='log';const ex=l.exercises||[];el.innerHTML='<div class="logTop"><div><b>'+fmt(l.attended_at)+'</b><div class="meta">'+l.minutes+'분 · '+esc(l.pass_label)+'</div></div><span class="chip">운동 '+ex.length+'개</span></div>'+(l.special_notes?'<div class="notes">'+esc(l.special_notes)+'</div>':'<div class="notes" style="color:var(--muted)">특이사항 없음</div>')+'<div class="chips">'+ex.slice(0,4).map(e=>'<span class="chip">'+esc(e.name)+'</span>').join('')+(ex.length>4?'<span class="chip">외 '+(ex.length-4)+'개</span>':'')+'</div><div class="logBtns"><button class="mini edit">상세 · 수정</button><button class="mini sig">출석 서명 보기</button></div>';el.querySelector('.edit').onclick=()=>editLog(l);el.querySelector('.sig').onclick=()=>viewSig(l);box.appendChild(el)})}
function eligibleAttendance(memberId,includeId=null){return(data.attendance||[]).filter(a=>a.member_id===memberId&&(!a.log_id||a.attendance_id===includeId)).sort((a,b)=>new Date(b.attended_at)-new Date(a.attended_at))}
function attendanceOption(a){return fmt(a.attended_at)+' · '+a.minutes+'분 · '+a.pass_label}
function fillAttendance(memberId,selectedId=null){const list=eligibleAttendance(memberId,selectedId),sel=$('#attendanceSelect');sel.innerHTML='';list.forEach(a=>{const o=document.createElement('option');o.value=a.attendance_id;o.textContent=attendanceOption(a);if(a.attendance_id===selectedId)o.selected=true;sel.appendChild(o)});return list}
function blankExercise(){return{name:'',sets:'',reps_time:'',load:'',memo:''}}
function renderExercises(arr=[]){const box=$('#exerciseRows');box.innerHTML='';const list=arr.length?arr:[blankExercise()];list.forEach(x=>addRow(x))}
function addRow(x=blankExercise()){const row=document.createElement('div');row.className='row';row.innerHTML='<div class="rowTop"><input class="nameInput" placeholder="운동명" value="'+esc(x.name||'')+'"><div class="unitField"><input class="sets" placeholder="세트" value="'+esc(x.sets||'')+'"><span class="unitSuffix">Set</span></div><input class="reps" placeholder="횟수/시간" value="'+esc(x.reps_time||'')+'"><div class="unitField"><input class="load" placeholder="중량" value="'+esc(x.load||'')+'"><span class="unitSuffix">Kg</span></div><button class="remove" type="button">×</button></div><div class="rowMemo"><input class="memo" placeholder="메모 / 큐 / 반응" value="'+esc(x.memo||'')+'"></div>';row.querySelector('.remove').onclick=()=>row.remove();$('#exerciseRows').appendChild(row)}
function collectExercises(){return[...document.querySelectorAll('#exerciseRows .row')].map(r=>({name:r.querySelector('.nameInput').value.trim(),sets:r.querySelector('.sets').value.trim(),reps_time:r.querySelector('.reps').value.trim(),load:r.querySelector('.load').value.trim(),memo:r.querySelector('.memo').value.trim()})).filter(x=>x.name)}
function newLog(preselectId=null){const m=(data.members||[]).find(x=>x.member_id===currentMember),list=fillAttendance(currentMember,preselectId);if(!list.length){toast('먼저 출석 서명이 완료된 기록이 필요해요');return}editing=null;$('#editorTitle').textContent=m.name+'님 수업 일지 작성';$('#editorSub').textContent='출석 기록 1건과 수업 일지 1건이 연결됩니다.';$('#specialNotes').value='';renderExercises([]);$('#deleteLog').classList.add('hide');$('#editor').classList.remove('hide')}
function openDeepAttendance(id){const a=(data.attendance||[]).find(x=>x.attendance_id===id);if(!a){deepHandled=true;toast('연결할 출석 기록을 찾지 못했어요');return}deepHandled=true;currentMember=a.member_id;openMember(a.member_id);if(a.log_id){const l=(data.logs||[]).find(x=>x.log_id===a.log_id);if(l){editLog(l);return}}newLog(id)}
function editLog(l){editing=l;currentMember=l.member_id;fillAttendance(l.member_id,l.attendance_id);$('#editorTitle').textContent=l.name+'님 수업 일지';$('#editorSub').textContent=fmt(l.attended_at)+' · '+l.minutes+'분';$('#specialNotes').value=l.special_notes||'';renderExercises(l.exercises||[]);$('#deleteLog').classList.remove('hide');$('#editor').classList.remove('hide')}
function copyPrevious(){const selectedId=$('#attendanceSelect').value,currentAtt=(data.attendance||[]).find(a=>a.attendance_id===selectedId),currentTime=currentAtt?new Date(currentAtt.attended_at).getTime():Infinity;const logs=(data.logs||[]).filter(l=>l.member_id===currentMember&&(!editing||l.log_id!==editing.log_id)&&new Date(l.attended_at).getTime()<currentTime).sort((a,b)=>new Date(b.attended_at)-new Date(a.attended_at));const prev=logs[0]||(data.logs||[]).filter(l=>l.member_id===currentMember&&(!editing||l.log_id!==editing.log_id)).sort((a,b)=>new Date(b.attended_at)-new Date(a.attended_at))[0];if(!prev){toast('불러올 이전 수업 기록이 없어요');return}renderExercises((prev.exercises||[]).map(x=>({name:x.name,sets:x.sets,reps_time:x.reps_time,load:x.load,memo:x.memo})));toast('지난 수업 운동 기록을 불러왔어요')}
async function saveLog(){const attendanceId=$('#attendanceSelect').value;if(!attendanceId){toast('연결할 출석 기록이 필요해요');return}const b=$('#saveLog');b.disabled=true;b.textContent='저장 중…';const{error}=await sb.rpc('save_session_log',{p_log_id:editing?.log_id||null,p_attendance_id:attendanceId,p_special_notes:$('#specialNotes').value,p_exercises:collectExercises()});b.disabled=false;b.textContent='저장';if(error){toast(error.message.includes('already')?'이미 일지가 연결된 출석이에요':'저장 실패');return}$('#editor').classList.add('hide');toast(editing?'수업 일지를 수정했어요':'수업 일지를 저장했어요');editing=null;await load()}
async function deleteLog(){if(!editing||!confirm('이 수업 일지를 삭제할까요?\
출석 기록과 세션 차감은 삭제되지 않습니다.'))return;const{data:ok,error}=await sb.rpc('delete_session_log',{p_log_id:editing.log_id});if(error||!ok){toast('일지 삭제 실패');return}$('#editor').classList.add('hide');editing=null;toast('수업 일지를 삭제했어요');await load()}
function fit(c,context){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);context.setTransform(d,0,0,d,0,0);context.lineCap='round';context.lineJoin='round';context.lineWidth=2.2;context.strokeStyle='#24362A'}
function redraw(c,context,sig){fit(c,context);context.clearRect(0,0,c.clientWidth,c.clientHeight);const ss=sig?.strokes||[];ss.forEach(s=>{if(!s.length)return;context.beginPath();s.forEach((p,i)=>{const x=p[0]*c.clientWidth,y=p[1]*c.clientHeight;i?context.lineTo(x,y):context.moveTo(x,y)});context.stroke()})}
function viewSig(l){$('#sigTitle').textContent=l.name+'님 출석 서명';$('#sigMeta').textContent=fmt(l.attended_at)+' · '+l.minutes+'분';$('#sigModal').classList.remove('hide');requestAnimationFrame(()=>redraw($('#sigCanvas'),$('#sigCanvas').getContext('2d'),l.signature))}
$('#loginBtn').onclick=login;$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();showAuth()};$('#search').oninput=renderMembers;$('#backBtn').onclick=()=>{currentMember=null;detailPanel.classList.add('hide');memberPanel.classList.remove('hide');renderMembers()};$('#newBtn').onclick=()=>newLog();$('#addExercise').onclick=()=>addRow();$('#copyPrev').onclick=copyPrevious;$('#cancelEdit').onclick=()=>$('#editor').classList.add('hide');$('#saveLog').onclick=saveLog;$('#deleteLog').onclick=deleteLog;$('#closeSig').onclick=()=>$('#sigModal').classList.add('hide');window.addEventListener('resize',()=>{if(!$('#sigModal').classList.contains('hide')){const l=editing||null;if(l)redraw($('#sigCanvas'),$('#sigCanvas').getContext('2d'),l.signature)}});init();
</script>
</body>
</html>
