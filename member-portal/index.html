<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#667761">
<meta name="referrer" content="strict-origin">
<title>Quokka Member 🍃</title>
<style>
:root{--bg:#F3F0E7;--paper:#FFFDF8;--brand:#667761;--brand2:#7D8C76;--brand3:#55654F;--ink:#233126;--muted:#6F776F;--line:#DCD6CC;--soft:#EDF2EA;--blue:#2F6F8F;--danger:#9A4B45;--dangerSoft:#F8ECEA}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#EEF1E7 0,#F5F1E8 42%,#ECE8DE 100%);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}button,input{font:inherit}.wrap{max-width:760px;margin:auto;padding:18px 14px 56px}.hero{background:linear-gradient(145deg,var(--brand),var(--brand2));color:white;padding:28px 21px;border-radius:26px;box-shadow:0 16px 38px rgba(59,74,56,.15)}.hero small{font-weight:900;color:#FFF3D9;letter-spacing:.06em}.hero h1{margin:5px 0 4px;font-size:31px;letter-spacing:-.04em}.hero p{margin:0;color:#F3F3EC;font-size:13px}.panel{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 9px 24px rgba(68,79,64,.05)}.hide{display:none!important}.login h2,.panel h2{margin:0 0 11px;font-size:20px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted);font-weight:800}.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:white;font-size:18px;letter-spacing:.08em}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:900;cursor:pointer}.primary{background:var(--brand);color:white}.secondary{background:white;color:var(--brand);border:1px solid var(--line)}.msg{min-height:20px;color:var(--danger);font-size:13px;margin-top:8px}.memberHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.memberHead h2{font-size:25px;margin:0}.memberHead small{color:var(--muted)}.badge{padding:6px 9px;border-radius:999px;background:var(--soft);color:var(--brand3);font-size:12px;font-weight:900}.passCard{margin-top:12px;border:1px solid var(--line);border-radius:18px;padding:16px;background:#FCFBF7}.passTop{display:flex;justify-content:space-between;gap:12px;align-items:start}.passName{font-size:19px;font-weight:900}.passDate{font-size:12px;color:var(--muted);margin-top:4px}.amount{font-weight:900;color:#19324A;white-space:nowrap}.progressText{display:flex;justify-content:space-between;gap:10px;margin-top:16px;font-size:13px}.progressText b{color:var(--blue)}.track{height:10px;border-radius:999px;background:#E8E5DE;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:999px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}.stat small{display:block;color:var(--muted);font-size:11px}.stat b{display:block;margin-top:3px;font-size:18px;color:#19324A}.sharedNote{margin-top:10px;padding:10px 11px;border-radius:12px;background:#F2F5F0;color:var(--brand3);font-size:12px;font-weight:800}.titleRow{display:flex;align-items:end;justify-content:space-between;gap:10px}.titleRow h2{margin:0}.titleRow small{color:var(--muted)}.history{display:grid;gap:8px;margin-top:12px}.hist{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:#FCFBF7}.hist b{font-size:15px}.meta{font-size:12px;color:var(--muted);margin-top:3px}.mini{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:white;color:var(--brand);font-size:12px;font-weight:900}.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:14px}.payments{display:grid;gap:8px;margin-top:12px}.pay{padding:12px;border:1px solid var(--line);border-radius:14px;background:#FCFBF7}.payTop{display:flex;justify-content:space-between;gap:10px}.payTop b{font-size:14px}.payAmt{font-weight:900;color:#19324A}.privacy{margin-top:14px;text-align:center;color:#92988F;font-size:11px;line-height:1.6}.modal{position:fixed;inset:0;background:rgba(24,36,28,.46);display:grid;place-items:end center;padding:12px;z-index:50}.sheet{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:24px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.22)}.sheet h2{margin:0 0 4px}.sigWrap{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:white;margin-top:12px}canvas{display:block;width:100%;height:240px;background:white}.sheet .sub{color:var(--muted);font-size:13px}.loading{opacity:.6}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr 1fr}.stat{padding:10px}.stat b{font-size:17px}.hist{grid-template-columns:1fr}.hist .mini{justify-self:end}.hero h1{font-size:28px}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><small>QUOKKA MEMBER</small><h1>나의 수강권 🍃</h1><p>수강권과 출석 기록을 확인할 수 있습니다.</p></section>
<section id="invalid" class="panel hide"><h2>개인 링크가 필요합니다</h2><div class="meta">전달받은 회원 전용 링크로 접속해 주세요.</div></section>
<section id="login" class="panel login hide"><h2>회원 확인</h2><div class="meta">개인 페이지 PIN 6자리를 입력해 주세요.</div><div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6자리 PIN"></div><button id="enter" class="btn primary" style="width:100%">내 페이지 보기</button><div id="msg" class="msg"></div></section>
<section id="app" class="hide">
<section class="panel"><div class="memberHead"><div><h2 id="name">회원님</h2><small>MY MEMBERSHIP</small></div><span class="badge">조회 전용</span></div><div id="current"></div></section>
<section class="panel"><div class="titleRow"><h2>출석 기록</h2><small id="histCount">0회</small></div><div id="history" class="history"></div></section>
<section class="panel"><div class="titleRow"><h2>결제 이력</h2><small>수강권 회차별 기록</small></div><div id="payments" class="payments"></div></section>
<div class="privacy">회원 본인의 수강권 및 출석 기록만 표시됩니다.<br>수정이 필요한 경우 담당자에게 문의해 주세요.</div>
</section>
</main>
<div id="sigModal" class="modal hide"><div class="sheet"><h2 id="sigTitle">서명 확인</h2><div id="sigMeta" class="sub"></div><div class="sigWrap"><canvas id="sigCanvas"></canvas></div><button id="closeSig" class="btn primary" style="width:100%;margin-top:12px">닫기</button></div></div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const URL='https://bspzgodfoekodysjnsrn.supabase.co',KEY='sb_publishable_7JqWs7VbtXMBP_6e_NJnLw_b7yTnShf',sb=createClient(URL,KEY),$=s=>document.querySelector(s);
const token=decodeURIComponent(location.hash.slice(1));let data=null,currentSig=null;
const won=v=>Number(v||0).toLocaleString('ko-KR')+'원';
const date=v=>String(v||'').replaceAll('-','.');
const dt=v=>new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v));
if(!token){$('#invalid').classList.remove('hide')}else{$('#login').classList.remove('hide');const saved=sessionStorage.getItem('qm_pin_'+token);if(saved){$('#pin').value=saved;setTimeout(enter,30)}}
async function enter(){const pin=$('#pin').value.trim();if(!/^\d{6}$/.test(pin)){$('#msg').textContent='PIN 6자리를 입력해 주세요.';return}const b=$('#enter');b.disabled=true;b.textContent='불러오는 중…';$('#msg').textContent='';const{data:d,error}=await sb.rpc('member_portal_data',{p_token:token,p_pin:pin});b.disabled=false;b.textContent='내 페이지 보기';if(error||!d?.ok){$('#msg').textContent='PIN이 맞지 않거나 사용할 수 없는 링크입니다.';return}sessionStorage.setItem('qm_pin_'+token,pin);data=d;$('#login').classList.add('hide');$('#app').classList.remove('hide');render()}
$('#enter').onclick=enter;$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
function render(){const m=data.member,cp=data.current_pass,passes=data.passes||[],hist=data.history||[];$('#name').textContent=m.name+'님';$('#histCount').textContent='총 '+hist.length+'회';renderCurrent(cp);renderHistory(hist);renderPayments(passes)}
function renderCurrent(p){const box=$('#current');if(!p){box.innerHTML='<div class="empty" style="margin-top:12px">현재 사용 가능한 수강권이 없습니다.</div>';return}const shared=Number(p.member_count)>1,used=Number(p.used_sessions||0),mine=Number(p.personal_used||0),total=Number(p.total_sessions||0),remain=Number(p.remaining_sessions||0),pct=total?Math.min(100,Math.round(used/total*100)):0;box.innerHTML='<div class="passCard"><div class="passTop"><div><div class="passName">'+p.minutes+'분 · '+p.label+'</div><div class="passDate">'+p.purchase_round+'회차 : '+date(p.purchased_on)+'</div></div><div class="amount">'+won(p.amount_won)+'</div></div><div class="progressText"><span>'+(shared?'공유권 사용':'진행 횟수')+'</span><b>'+used+' / '+total+'회</b></div><div class="track"><div class="fill" style="width:'+pct+'%"></div></div><div class="stats"><div class="stat"><small>'+(shared?'나의 출석':'진행 횟수')+'</small><b>'+(shared?mine:used)+'회</b></div><div class="stat"><small>남은 횟수</small><b>'+remain+'회</b></div><div class="stat"><small>결제 금액</small><b style="font-size:14px">'+won(p.amount_won)+'</b></div></div>'+(shared?'<div class="sharedNote">공유 수강권입니다. 남은 횟수는 함께 사용하는 전체 수강권 기준입니다.</div>':'')+'</div>'}
function renderHistory(hist){const box=$('#history');box.innerHTML='';if(!hist.length){box.innerHTML='<div class="empty">아직 출석 기록이 없습니다.</div>';return}hist.forEach(h=>{const el=document.createElement('div');el.className='hist';el.innerHTML='<div><b>'+h.purchase_round+'회차 수강권 · 출석 '+h.personal_session_no+'회</b><div class="meta">'+dt(h.attended_at)+' · '+h.minutes+'분</div></div><button class="mini">서명 확인</button>';el.querySelector('button').onclick=()=>showSig(h);box.appendChild(el)})}
function renderPayments(ps){const box=$('#payments');box.innerHTML='';if(!ps.length){box.innerHTML='<div class="empty">결제 이력이 없습니다.</div>';return}ps.forEach(p=>{const shared=Number(p.member_count)>1,used=Number(p.used_sessions||0),mine=Number(p.personal_used||0),remain=Number(p.remaining_sessions||0);const el=document.createElement('div');el.className='pay';el.innerHTML='<div class="payTop"><div><b>'+p.purchase_round+'회차 : '+date(p.purchased_on)+'</b><div class="meta">'+p.minutes+'분 · '+p.label+'</div></div><div class="payAmt">'+won(p.amount_won)+'</div></div><div class="meta" style="margin-top:8px">'+(shared?'나의 출석 '+mine+'회 · 공유권 사용 '+used+'/'+p.total_sessions+'회 · 남음 '+remain+'회':'진행 '+used+'/'+p.total_sessions+'회 · 남음 '+remain+'회')+'</div>';box.appendChild(el)})}
const canvas=$('#sigCanvas'),ctx=canvas.getContext('2d');function fit(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=2.2;ctx.strokeStyle='#24362A'}function draw(sig){fit();ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);(sig?.strokes||[]).forEach(s=>{if(!s.length)return;ctx.beginPath();s.forEach((p,i)=>{const x=p[0]*canvas.clientWidth,y=p[1]*canvas.clientHeight;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()})}function showSig(h){currentSig=h.signature;$('#sigTitle').textContent='출석 '+h.personal_session_no+'회 서명';$('#sigMeta').textContent=dt(h.attended_at)+' · '+h.minutes+'분';$('#sigModal').classList.remove('hide');requestAnimationFrame(()=>draw(currentSig))}$('#closeSig').onclick=()=>{$('#sigModal').classList.add('hide');currentSig=null};window.addEventListener('resize',()=>{if(currentSig&&!$('#sigModal').classList.contains('hide'))draw(currentSig)});
</script>
</body>
</html>
